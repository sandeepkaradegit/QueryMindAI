[project]
name = "querymind-ai"
version = "0.1.0"
description = "A schema-aware natural-language analytics application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.7.0",
    "faiss-cpu>=1.12.0",
    "fastapi>=0.115,<1.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langsmith>=0.14.1",
    "openai>=3.22.1",
    "openevals>=0.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0,<3.0",
    "sqlglot>=30.20.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
